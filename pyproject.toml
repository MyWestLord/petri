[project]
name = "petri"
version = "0.1.0"
description = "A pump.fun trading bot with a brain. Touch a rug → get zapped."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "websockets>=12", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
live = ["solders>=0.21"]
dev = ["pytest>=8"]

[project.scripts]
petri = "petri.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
